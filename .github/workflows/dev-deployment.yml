# ─────────────────────────────────────────────────────────────────
# dev-deploy.yml — Build and deploy all microservices to your local
# Kind cluster via kindling.
#
# This workflow runs on your SELF-HOSTED runner (created by the
# GithubActionRunnerPool CR). It uses Kaniko to build four container
# images (three Go services + a React dashboard) and pushes them to
# the in-cluster registry at registry:5000. It then applies four
# DevStagingEnvironment CRs — the kindling operator provisions
# Postgres, MongoDB, and Redis automatically.
#
# No Docker daemon required — Kaniko builds in userspace pods.
# ─────────────────────────────────────────────────────────────────
name: Microservices Deploy

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/dev-deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, "${{ github.actor }}"]

    env:
      TAG: "${{ github.actor }}-${{ github.sha }}"
      REGISTRY: "registry:5000"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Build all service images with Kaniko ──────────────────
      #
      # Each step tars up the build context and pipes it into a
      # one-shot Kaniko executor pod via kubectl. Kaniko builds in
      # userspace (no Docker daemon) and pushes directly to the
      # in-cluster registry.
      #
      - name: Build & push gateway image
        run: |
          kubectl delete pod kaniko-gateway 2>/dev/null || true
          tar -czf - -C gateway/ . | kubectl run kaniko-gateway \
            --rm -i --restart=Never \
            --image=gcr.io/kaniko-project/executor:latest \
            -- --context=tar://stdin \
               --destination=$REGISTRY/ms-gateway:$TAG \
               --insecure \
               --cache=false
          echo "✅ Built & pushed ms-gateway:$TAG"

      - name: Build & push orders image
        run: |
          kubectl delete pod kaniko-orders 2>/dev/null || true
          tar -czf - -C orders/ . | kubectl run kaniko-orders \
            --rm -i --restart=Never \
            --image=gcr.io/kaniko-project/executor:latest \
            -- --context=tar://stdin \
               --destination=$REGISTRY/ms-orders:$TAG \
               --insecure \
               --cache=false
          echo "✅ Built & pushed ms-orders:$TAG"

      - name: Build & push inventory image
        run: |
          kubectl delete pod kaniko-inventory 2>/dev/null || true
          tar -czf - -C inventory/ . | kubectl run kaniko-inventory \
            --rm -i --restart=Never \
            --image=gcr.io/kaniko-project/executor:latest \
            -- --context=tar://stdin \
               --destination=$REGISTRY/ms-inventory:$TAG \
               --insecure \
               --cache=false
          echo "✅ Built & pushed ms-inventory:$TAG"

      - name: Build & push UI image
        run: |
          kubectl delete pod kaniko-ui 2>/dev/null || true
          tar -czf - -C ui/ . | kubectl run kaniko-ui \
            --rm -i --restart=Never \
            --image=gcr.io/kaniko-project/executor:latest \
            -- --context=tar://stdin \
               --destination=$REGISTRY/ms-ui:$TAG \
               --insecure \
               --cache=false
          echo "✅ Built & pushed ms-ui:$TAG"

      # ── 3. Deploy Orders Service (Postgres + Redis) ──────────────
      - name: Deploy orders service
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps.example.com/v1alpha1
          kind: DevStagingEnvironment
          metadata:
            name: ${{ github.actor }}-orders
            labels:
              app.kubernetes.io/part-of: microservices-demo
              app.kubernetes.io/component: orders
              apps.example.com/github-username: ${{ github.actor }}
          spec:
            deployment:
              image: $REGISTRY/ms-orders:$TAG
              replicas: 1
              port: 8081
              healthCheck:
                path: /healthz
            service:
              port: 8081
              type: ClusterIP
            dependencies:
              - type: postgres
                version: "16"
              - type: redis
          EOF
          echo "✅ Orders DevStagingEnvironment applied"

      # ── 4. Deploy Inventory Service (MongoDB + shared Redis) ─────
      - name: Deploy inventory service
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps.example.com/v1alpha1
          kind: DevStagingEnvironment
          metadata:
            name: ${{ github.actor }}-inventory
            labels:
              app.kubernetes.io/part-of: microservices-demo
              app.kubernetes.io/component: inventory
              apps.example.com/github-username: ${{ github.actor }}
          spec:
            deployment:
              image: $REGISTRY/ms-inventory:$TAG
              replicas: 1
              port: 8082
              env:
                - name: REDIS_URL
                  value: "redis://${{ github.actor }}-orders-redis:6379/0"
              healthCheck:
                path: /healthz
            service:
              port: 8082
              type: ClusterIP
            dependencies:
              - type: mongodb
          EOF
          echo "✅ Inventory DevStagingEnvironment applied"

      # ── 5. Deploy Gateway ────────────────────────────────────────
      - name: Deploy gateway
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps.example.com/v1alpha1
          kind: DevStagingEnvironment
          metadata:
            name: ${{ github.actor }}-gateway
            labels:
              app.kubernetes.io/part-of: microservices-demo
              app.kubernetes.io/component: gateway
              apps.example.com/github-username: ${{ github.actor }}
          spec:
            deployment:
              image: $REGISTRY/ms-gateway:$TAG
              replicas: 1
              port: 8080
              env:
                - name: ORDERS_SERVICE_URL
                  value: "http://${{ github.actor }}-orders:8081"
                - name: INVENTORY_SERVICE_URL
                  value: "http://${{ github.actor }}-inventory:8082"
              healthCheck:
                path: /healthz
            service:
              port: 8080
              type: ClusterIP
          EOF
          echo "✅ Gateway DevStagingEnvironment applied"

      # ── 6. Deploy UI Dashboard ──────────────────────────────────
      - name: Deploy UI dashboard
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps.example.com/v1alpha1
          kind: DevStagingEnvironment
          metadata:
            name: ${{ github.actor }}-ui
            labels:
              app.kubernetes.io/part-of: microservices-demo
              app.kubernetes.io/component: ui
              apps.example.com/github-username: ${{ github.actor }}
          spec:
            deployment:
              image: $REGISTRY/ms-ui:$TAG
              replicas: 1
              port: 80
              env:
                - name: GATEWAY_URL
                  value: "http://${{ github.actor }}-gateway:8080"
              healthCheck:
                path: /
            service:
              port: 80
              type: ClusterIP
            ingress:
              enabled: true
              host: ${{ github.actor }}-ui.localhost
              ingressClassName: nginx
          EOF
          echo "✅ UI DevStagingEnvironment applied"

      # ── 7. Wait for rollouts ─────────────────────────────────────
      - name: Wait for all deployments
        run: |
          for svc in orders inventory gateway ui; do
            echo "⏳ Waiting for ${{ github.actor }}-${svc}..."
            kubectl rollout status deployment/${{ github.actor }}-${svc} \
              --timeout=120s || true
          done

          echo ""
          echo "📦 Pods:"
          kubectl get pods -l app.kubernetes.io/part-of=microservices-demo

          echo ""
          echo "🌐 Services:"
          kubectl get svc | grep -E "${{ github.actor }}-(gateway|orders|inventory|ui)"

          echo ""
          echo "🎯 DevStagingEnvironments:"
          kubectl get devstagingenvironments -l app.kubernetes.io/part-of=microservices-demo

      # ── 8. Smoke test ────────────────────────────────────────────
      - name: Smoke test
        run: |
          kubectl port-forward svc/${{ github.actor }}-gateway 18080:8080 &
          PF_PID=$!
          sleep 3

          echo "── Gateway health ─────────────────────"
          curl -s http://localhost:18080/healthz | jq .

          echo ""
          echo "── Aggregated status ──────────────────"
          curl -s http://localhost:18080/status | jq .

          echo ""
          echo "── Create an order ────────────────────"
          curl -s -X POST http://localhost:18080/orders \
            -H "Content-Type: application/json" \
            -d '{"product":"widget-a","quantity":2}' | jq .

          echo ""
          echo "── Check inventory (stock decremented) ─"
          sleep 2  # give the queue consumer a moment
          curl -s http://localhost:18080/inventory | jq .

          kill $PF_PID 2>/dev/null || true
          echo ""
          echo "🎉 All services deployed!"
          echo "🎨 UI dashboard: http://${{ github.actor }}-ui.localhost"
          echo "🌐 Gateway API:  http://${{ github.actor }}-gateway.localhost"
          echo "📡 Fallback:     kubectl port-forward svc/${{ github.actor }}-gateway 8080:8080"
